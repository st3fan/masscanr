name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
        working-directory: web
      - run: npm run generate:api && git diff --exit-code -- src/api/schema.ts
        working-directory: web
      - run: npm run typecheck && npm run lint && npm run format:check && npm run test && npm run build
        working-directory: web
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: web
      - run: go test -tags webui ./internal/webui && go build -tags webui -o /tmp/masscanr-server-web ./cmd/masscanr-server

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MASSCANR_TEST_POSTGRES: host=127.0.0.1 user=postgres dbname=postgres sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/masscanr-server ./cmd/masscanr-cli
      - name: Keep the watch client independent of scan execution
        run: |
          deps=$(go list -deps ./cmd/masscanr-cli)
          if printf '%s\n' "$deps" | grep -E '/internal/(backend|cloud|controller|remote|ripe|runapi|scan|scanfile|service|tui|cli)(/|$)'; then
            exit 1
          fi

  alpine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Alpine native configuration, replay and streaming (no network)
        run: scripts/check-alpine.sh

  zmap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: ZMap package, schema and native sharding (no network)
        run: scripts/check-zmap.sh
